services:
  pinakes:
    image: ghcr.io/meykatoe/pinakes:latest
    # 自行建置時取消註解
    # build: .
    container_name: pinakes
    restart: unless-stopped
    # 檔案擁有者
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Taipei
    volumes:
      - ./config:/config
      # 硬連結需同一掛載
      - ${DATA_PATH:-/path/to/data}:/data
      # rclone 掛載點，需要時取消註解
      # - /mnt/pikpak:/mnt/pikpak:ro,rslave
