[project]
name = "pinakes"
version = "0.1.0"
description = "媒體整理與海報牆"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
